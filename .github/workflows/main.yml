name: Deploy Thrive Frontend

on:
  push:
    branches:
      - master

concurrency:
  group: thrive-production
  cancel-in-progress: false

jobs:
  deploy_production:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p ~/apps/thrive-frontend
            cd ~/apps/thrive-frontend

            if [ -d ".git" ]; then
              echo "Pulling latest changes..."
              git fetch origin master
              git reset --hard origin/master
            else
              echo "Cloning frontend repository..."
              git clone -b master https://github.com/yonathanth/thriveFrontend.git .
            fi

            echo "Installing dependencies..."
            npm install --force

            echo "Building frontend..."
            npm run build

            echo "Starting/reloading Thrive on port 3000..."
            if pm2 describe thrive-frontend > /dev/null 2>&1; then
              PORT=3000 pm2 restart thrive-frontend --update-env
            else
              PORT=3000 pm2 start npm --name "thrive-frontend" -- start -- -p 3000
            fi

            pm2 save

            echo "Thrive frontend deployed successfully!"
